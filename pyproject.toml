[project]
name = "modgud"
version = "0.1.0"
description = "A personal content triage system"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "openai>=2,<3",
    "trafilatura>=2.2.0,<3",
    "yt-dlp>=2026.8.19",
]

[project.scripts]
modgud = "modgud.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "ruff",
    "types-yt-dlp>=2026.8.19.20260827",
]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
extend-select = ["I", "UP"]
