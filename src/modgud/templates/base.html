<!doctype html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>{% block title %}modgud{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/modgud.css') }}">
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to content</a>

    <main id="content">
      {% block content %}{% endblock %}

      <p>Stored locally. Available on your network.</p>
    </footer>
  </body>
</html>
